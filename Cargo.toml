[package]
name = "rola"
version = "0.2.1"
edition = "2021"
description = "YouTube Music en la terminal, al estilo spotify-tui"
license = "MIT"
repository = "https://github.com/daniiiqa/rola"
readme = "README.md"
keywords = ["youtube-music", "tui", "music", "player", "terminal"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
ratatui = "0.29"
serde_json = { version = "1", features = ["preserve_order"] }
ureq = "2"
sha1_smol = "1"
libc = "0.2"
ratatui-image = { version = "8.1", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
zbus = "5"
sha2 = "0.11.1"
qrcode = { version = "0.14", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
